<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mock — Account (dark + bold)</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gradient-to-br from-zinc-950 via-indigo-950 to-violet-950 text-white font-sans min-h-screen">
<header class="sticky top-0 z-50 backdrop-blur bg-zinc-950/70 border-b border-white/10">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <a class="flex items-center gap-2 font-bold tracking-tight text-xl"><span class="inline-block w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-500"></span>LessonLock</a>
    <button class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-violet-500 flex items-center justify-center font-semibold text-sm">MC</button>
  </div>
</header>
<main class="max-w-2xl mx-auto px-6 py-10">
  <a class="text-indigo-300 text-sm hover:text-white">← Back to dashboard</a>
  <h1 class="text-4xl font-bold tracking-tight mt-4">Account details</h1>
  <div class="mt-8 rounded-3xl bg-white/10 backdrop-blur border border-white/20 p-6 space-y-4">
    <div><p class="text-sm text-indigo-200">Name</p><p class="mt-1 font-semibold">Maya Chen</p></div>
    <div><p class="text-sm text-indigo-200">Email</p><p class="mt-1 font-semibold">maya@example.com</p></div>
    <div><p class="text-sm text-indigo-200">Stripe</p><p class="mt-1 font-semibold text-emerald-400">Connected ✓</p></div>
    <div><p class="text-sm text-indigo-200">Plan</p><p class="mt-1 font-semibold">Starter — $12/mo</p></div>
  </div>
  <button class="mt-6 rounded-full bg-red-500/20 border border-red-400/40 text-red-300 px-6 py-3 font-semibold">Sign out</button>
</main></body></html>
